name: Build docs
on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build docs website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install pnpm
        id: pnpm-install
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: |
            - args: [--frozen-lockfile]

      - name: Build docs website
        run: pnpm build
